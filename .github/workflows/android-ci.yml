name: Android CI

"on":
  push:
    branches:
      - master
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      - name: Install Android SDK 37
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Verify unit tests, lint, and minified release build
        run: >-
          ./gradlew --no-daemon --stacktrace
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleRelease

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-verification-reports
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/app/reports/tests/
            build/app/reports/lint-results-*.html
            build/app/reports/lint-results-*.xml
            build/app/outputs/mapping/release/
