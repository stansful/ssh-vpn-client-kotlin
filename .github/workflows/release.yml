name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bundle_xray_core:
        description: 'Bundle libXray.aar into the release APKs'
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify tag matches versionName
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          declared_version="$(grep -oP 'val appVersionName = "\K[^"]+' app/build.gradle.kts)"
          if [[ "$tag_version" != "$declared_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match appVersionName $declared_version" >&2
            exit 1
          fi
          echo "Releasing version $declared_version"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SSH_VPN_RELEASE_STORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "SSH_VPN_RELEASE_STORE_BASE64 secret is not configured" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.keystore"
          chmod 600 "$RUNNER_TEMP/signing/release.keystore"

      - name: Assemble release
        env:
          SSH_VPN_RELEASE_STORE_FILE: ${{ runner.temp }}/signing/release.keystore
          SSH_VPN_RELEASE_STORE_PASSWORD: ${{ secrets.SSH_VPN_RELEASE_STORE_PASSWORD }}
          SSH_VPN_RELEASE_KEY_ALIAS: ${{ secrets.SSH_VPN_RELEASE_KEY_ALIAS }}
          SSH_VPN_RELEASE_KEY_PASSWORD: ${{ secrets.SSH_VPN_RELEASE_KEY_PASSWORD }}
        run: |
          if [[ "${{ inputs.bundle_xray_core }}" == "true" ]]; then
            ./gradlew :app:assembleRelease -PbundleXrayCore=true --stacktrace
          else
            ./gradlew :app:assembleRelease --stacktrace
          fi

      - name: Collect artifacts and checksums
        id: artifacts
        run: |
          out_dir="build/app/outputs/apk/release"
          if [[ ! -d "$out_dir" ]]; then
            out_dir="app/build/outputs/apk/release"
          fi
          mkdir -p release-artifacts
          shopt -s nullglob
          found=0
          for apk in "$out_dir"/*.apk; do
            case "$apk" in
              *-unsigned.apk)
                echo "Refusing to publish unsigned artifact: $apk" >&2
                exit 1
                ;;
            esac
            cp "$apk" release-artifacts/
            found=1
          done
          if [[ "$found" -ne 1 ]]; then
            echo "No release APKs found in $out_dir" >&2
            exit 1
          fi
          cd release-artifacts
          sha256sum *.apk > sha256sums.txt
          cat sha256sums.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: release-artifacts/*
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
